name: Install system dependencies
description: >-
  Update apt and install the requested packages, restoring the stock Ubuntu
  archive source when a runner image boots without it.

inputs:
  packages:
    description: Space-separated package list passed to apt-get install.
    required: true

runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # ubuntu-latest 26.04 images occasionally boot with only the Microsoft
        # repository configured: /etc/apt/apt-mirrors.txt and the Ubuntu
        # sources are missing, so apt reports every stock package (even cmake)
        # as unavailable. Detect the empty package index and restore the stock
        # archive source before retrying.
        sudo apt-get update || true
        if ! apt-cache policy cmake | grep -q 'Candidate: [0-9]'; then
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/ubuntu-archive.sources >/dev/null <<EOF
        Types: deb
        URIs: http://archive.ubuntu.com/ubuntu
        Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
        Components: main universe restricted multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
          sudo apt-get update || true
        fi
        sudo apt-get install -y $PACKAGES
