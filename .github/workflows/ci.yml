name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Self-test
        run: ./bin/GB4ME --selftest

  # Blargg cpu_instrs suite: the real SM83 conformance check. Runs headless
  # via --blargg (serial pass/fail); any subtest failure fails the job.
  blargg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Fetch Blargg test ROMs
        run: git clone --depth 1 https://github.com/retrio/gb-test-roms.git test-roms

      - name: Run cpu_instrs (01-11)
        run: |
          fail=0
          for rom in test-roms/cpu_instrs/individual/*.gb; do
            ./bin/GB4ME --blargg "$rom" || fail=1
          done
          exit $fail

      # Screen-only verdicts: halt_bug and interrupt_time report over neither
      # the serial port nor cartridge RAM - they draw "Passed"/"Failed" with
      # Blargg's console, whose font makes a BG tile index the ASCII code, so
      # PPU::console_shows() reads the text out of the tile map. interrupt_time
      # is a CGB-built ROM (.define REQUIRE_CGB), halt_bug is a DMG one, so
      # they have to run in the matching mode.
      - name: Run halt_bug (DMG) + interrupt_time (CGB)
        run: |
          fail=0
          GB4ME_FORCE_DMG=1 ./bin/GB4ME --blargg test-roms/halt_bug.gb || fail=1
          ./bin/GB4ME --blargg test-roms/interrupt_time/interrupt_time.gb || fail=1
          exit $fail

      # Memory-access timing: every instruction's read/write has to land on
      # the M-cycle the CPU's per-cycle hook puts it on (CPU::set_cycle_hook).
      # These six report through cartridge RAM, not the serial port.
      - name: Run mem_timing + mem_timing-2 + instr_timing
        run: |
          fail=0
          for rom in test-roms/mem_timing/individual/*.gb \
                    test-roms/mem_timing-2/rom_singles/*.gb \
                    test-roms/instr_timing/instr_timing.gb; do
            ./bin/GB4ME --blargg "$rom" || fail=1
          done
          exit $fail

  # The rest of the conformance picture, split into "gates" and "known
  # failures" on purpose. A suite whose verdict is already correct (or already
  # known-wrong) should not be able to rot silently, and a new failure has to
  # be obvious rather than lost in a wall of expected red.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Fetch test ROMs
        run: |
          git clone --depth 1 https://github.com/retrio/gb-test-roms.git test-roms
          git clone --depth 1 https://github.com/jsmolka/gba-tests.git gba-tests

      # GBA: every jsmolka/gba-tests ROM that reports a verdict on screen.
      # ppu/*, bios/bios and unsafe/unsafe are visual/crash tests with no
      # verdict text, so they cannot gate anything here.
      - name: Run jsmolka gba-tests
        run: |
          fail=0
          for rom in gba-tests/arm/arm.gba gba-tests/thumb/thumb.gba \
                    gba-tests/memory/memory.gba gba-tests/nes/nes.gba \
                    gba-tests/save/none.gba gba-tests/save/sram.gba \
                    gba-tests/save/flash64.gba gba-tests/save/flash128.gba; do
            ./bin/GB4ME --gba-tests "$rom" || fail=1
          done
          exit $fail

      # DMG-only Blargg ROMs (they carry a CGB flag but describe DMG hardware),
      # so they need GB4ME_FORCE_DMG. oam_bug: 2/3/4/5/6 pass; 1-lcd_sync,
      # 7-timing_effect and 8-instr_effect are known failures and are listed
      # here so a *new* failure stands out.
      - name: Run oam_bug (known failures enumerated)
        run: |
          fail=0
          for rom in 2-causes 3-non_causes 4-scanline_timing 5-timing_bug \
                      6-timing_no_bug; do
            GB4ME_FORCE_DMG=1 ./bin/GB4ME --blargg \
              "test-roms/oam_bug/rom_singles/$rom.gb" || fail=1
          done
          for rom in 1-lcd_sync 7-timing_effect 8-instr_effect; do
            echo "::group::known failure: $rom"
            GB4ME_FORCE_DMG=1 ./bin/GB4ME --blargg \
              "test-roms/oam_bug/rom_singles/$rom.gb" || echo "(still failing, as documented)"
            echo "::endgroup::"
          done
          exit $fail

      # CGB variants of the same suite: 01-06, 08 and 11 pass, 07 (#5), 09, 10
      # and 12 do not (agents.md has each one). These run *without*
      # GB4ME_FORCE_DMG - the point is that they exercise the CGB model.
      - name: Run cgb_sound (known failures enumerated)
        run: |
          fail=0
          for rom in test-roms/cgb_sound/rom_singles/*.gb; do
            case "$(basename "$rom")" in
              01-*|02-*|03-*|04-*|05-*|06-*|08-*|11-*) ;;
              *) echo "::group::known failure: $(basename "$rom")"
                 ./bin/GB4ME --blargg "$rom" || echo "(still failing, as documented)"
                 echo "::endgroup::"
                 continue ;;
            esac
            ./bin/GB4ME --blargg "$rom" || fail=1
          done
          exit $fail

      # dmg_sound: 01-06, 08 and 11 pass; 07 (#5), 09, 10 and 12 need the
      # T-cycle CPU/APU coupling documented in agents.md.
      - name: Run dmg_sound (known failures enumerated)
        run: |
          fail=0
          for rom in test-roms/dmg_sound/rom_singles/*.gb; do
            case "$(basename "$rom")" in
              01-*|02-*|03-*|04-*|05-*|06-*|08-*|11-*) ;;
              *) echo "::group::known failure: $(basename "$rom")"
                 GB4ME_FORCE_DMG=1 ./bin/GB4ME --blargg "$rom" \
                   || echo "(still failing, as documented)"
                 echo "::endgroup::"
                 continue ;;
            esac
            GB4ME_FORCE_DMG=1 ./bin/GB4ME --blargg "$rom" || fail=1
          done
          exit $fail

  # clang-format gate. The tree is formatted to .clang-format; this keeps it
  # that way. The version is pinned to the PyPI mirror of the LLVM release so
  # the result does not drift with the runner image (22.1.8 = the version the
  # sources were formatted with).
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-format
        run: pip install --user clang-format==22.1.8

      - name: Check formatting
        run: |
          # First-party sources only; the stb_* single-header libraries are
          # vendored upstream and keep their own formatting.
          { git ls-files '*.cpp' '*.h'
            git ls-files --others --exclude-standard '*.cpp' '*.h'
          } | grep -vE '^src/stb_(truetype|image)\.h$' > /tmp/gb4me-format.txt
          xargs -a /tmp/gb4me-format.txt clang-format --dry-run -Werror

  # clang-tidy gate. run-clang-tidy parallelises across the first-party
  # translation units; .clang-tidy is the check list and holds the reasoning
  # for the checks deliberately left out. WarningsAsErrors is '*', so a new
  # finding fails the job.
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc clang-tidy

      - name: Configure
        run: cmake --preset dev -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Build (compiles everything, so clang-tidy sees every header)
        run: cmake --build --preset dev

      - name: clang-tidy
        run: |
          files=$(find src -name '*.cpp' -not -name 'stb_*' | sort)
          run-clang-tidy -p build/dev -j "$(nproc)" -quiet $files

  # CMake discovery paths. The three ways of finding SDL3 are separate
  # branches of one if/else, and a wrong branch only shows up at configure
  # time on a machine that has no SDL3 package - which is exactly the machine
  # none of the build jobs above are. Configure-only: FetchContent adds SDL
  # as a subproject but nothing is compiled, so this stays cheap while still
  # catching the trap that SDL's own CMakeLists rewrites SDL_SHARED (see the
  # comment by the fetch block in CMakeLists.txt).
  cmake-discovery-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc

      - name: find_package path (default)
        run: cmake -S . -B build/pkgconfig-default -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: pkg-config path (forced)
        run: |
          cmake -S . -B build/pkgconfig-forced -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGB4ME_SDL3_PKGCONFIG=ON

      - name: FetchContent path (forced, no system package)
        run: |
          # Unset the package dirs so find_package/pkg-config cannot succeed
          # and the fetch branch is the one actually taken.
          cmake -S . -B build/fetch -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGB4ME_SDL3_FETCH=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DCMAKE_IGNORE_PATH="/usr/lib/x86_64-linux-gnu/cmake/SDL3;/usr/lib/cmake/SDL3"
          grep -q "SDL3: fetching" build/fetch/CMakeCache.txt || \
            grep -rl "SDL3: fetching" build/fetch/CMakeFiles 2>/dev/null || \
            echo "note: the fetch message is only in the configure log"

  # ASan + UBSan over the whole selftest (including the ROM boot smoke test
  # when a ROM is passed). Third-party ImGui is built without the sanitizers.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: cmake ninja-build pkg-config libsdl3-dev libvulkan-dev vulkan-validationlayers glslc

      - name: Configure (ASan + UBSan)
        run: cmake --preset dev-asan

      - name: Build
        run: cmake --build --preset dev-asan

      - name: Self-test under sanitizers
        run: ctest --preset selftest-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

